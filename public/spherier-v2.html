      ${c.halo ? `<circle cx="13" cy="13" r="${Math.min(c.halo, 12)}" fill="${teinte}" fill-opacity="${c.haloOpacite}"/>` : ''}
      <circle cx="13" cy="13" r="${c.r}" fill="${teinte}" fill-opacity="${c.opacite}"/>
    </svg>`;
  }

  function pastilleDifficulte(competence, classe = '') {
    const d = DIFFICULTES[competence.difficulty];
    if (!d) return '';
    return `<span class="pastille-diff ${classe}" style="--dc: ${d.couleur}"><i></i>${echapper(competence.difficulty)}</span>`;
  }

  // ============================================================
  // NOTE PERSONNELLE
  // ============================================================
  // Une note ne passe PAS par la barre d'enregistrement du sphérier : quelques phrases
  // écrites sur une conversation difficile ne doivent pas dépendre d'un geste que le
  // membre pourrait oublier. Elle part donc seule — à la sortie du champ, et après une
  // pause de frappe — avec un brouillon local en dernier recours.
  const NOTE_DELAI_MS = 1500;
  const NOTE_MAX = 4000;

  let noteMinuteur = null;
  let noteEnVol = null;

  const cleNote = (code) => `spherier-v2-note-${CLIENT_ID}-${code}`;

  function texteNote(code) {
    return (etat.notes && etat.notes[code] ? etat.notes[code].texte : '') || '';
  }

  const aUneNote = (code) => texteNote(code).trim() !== '';

  function marqueNote(code) {
    return aUneNote(code) ? '<span class="marque-note">Note</span>' : '';
  }

  function blocNote(competence) {
    const texte = texteNote(competence.id);
    const brouillonLocal = lireBrouillonNote(competence.id);
    const valeur = brouillonLocal !== null ? brouillonLocal : texte;
    const ouvert = valeur.trim() !== '';

    return `<section class="note-bloc${ouvert ? ' ouverte' : ''}" id="note-bloc">
      <button type="button" class="note-entete" id="note-entete" aria-expanded="${ouvert}">
        ${ouvert ? '<span class="note-marque"></span>' : ''}
        <span>Ma note</span>
        <span class="chev">▾</span>
      </button>
      <div class="note-corps">
        <textarea class="note-champ" id="note-champ" maxlength="${NOTE_MAX}"
          placeholder="Ce que tu veux garder de cette compétence : une situation, une intention, ce que tu as compris."
          aria-label="Note personnelle">${echapper(valeur)}</textarea>
        <div class="note-pied">
          <span class="note-etat" id="note-etat"></span>
          <span class="note-compteur" id="note-compteur"></span>
          <button type="button" class="note-btn" id="note-btn" disabled>Enregistrer</button>
        </div>
      </div>
    </section>`;
  }

  function lireBrouillonNote(code) {
    try {
      const v = localStorage.getItem(cleNote(code));
      return v === null ? null : v;
    } catch { return null; }
  }

  function ecrireBrouillonNote(code, texte) {
    try {
      if (texte === texteNote(code)) localStorage.removeItem(cleNote(code));
      else localStorage.setItem(cleNote(code), texte);
    } catch { /* stockage indisponible : on continue sans filet */ }
  }

  function etatNote(message, variante) {
    const el = document.getElementById('note-etat');
    if (!el) return;
    el.className = 'note-etat ' + (variante || '');
    el.innerHTML = message ? `<i></i>${echapper(message)}` : '';
  }

  function brancherNote(competence) {
    const bloc = document.getElementById('note-bloc');
    const champ = document.getElementById('note-champ');
    const bouton = document.getElementById('note-btn');
    const compteur = document.getElementById('note-compteur');
    if (!bloc || !champ) return;

    document.getElementById('note-entete').addEventListener('click', () => {
      const ouverte = bloc.classList.toggle('ouverte');
      document.getElementById('note-entete').setAttribute('aria-expanded', String(ouverte));
      if (ouverte) champ.focus();
    });

    const majCompteur = () => {
      const n = champ.value.length;
      compteur.textContent = n > NOTE_MAX - 400 ? `${n} / ${NOTE_MAX}` : '';
    };

    const modifiee = () => champ.value.trim() !== texteNote(competence.id).trim();

    const majBouton = () => {
      bouton.disabled = !modifiee();
      if (modifiee()) etatNote('Pas encore enregistrée', '');
    };

    const enregistrerLaNote = async () => {
      if (!modifiee()) return;
      clearTimeout(noteMinuteur);
      const texte = champ.value;
      etatNote('Enregistrement…', 'encours');
      bouton.disabled = true;
      noteEnVol = competence.id;
      try {
        const reponse = await fetch('/api/note', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uuid: CLIENT_ID, code: competence.id, texte }),
        });
        if (!reponse.ok) {
          const d = await reponse.json().catch(() => ({}));
          throw new Error(d.erreur || `Le serveur a répondu ${reponse.status}`);
        }
        const { note } = await reponse.json();
        if (!etat.notes) etat.notes = {};
        if (note.supprimee) delete etat.notes[competence.id];
        else etat.notes[competence.id] = { texte: note.texte, cree_le: note.cree_le, maj_le: note.maj_le };

        try { localStorage.removeItem(cleNote(competence.id)); } catch {}
        etatNote('Enregistrée', 'enregistree');
        bouton.disabled = true;
        // Le signalement « Note » doit apparaître aussitôt là où la compétence est listée.
        if (themeAffiche) { /* la liste sera régénérée au retour */ }
      } catch (err) {
        // Rien n'est perdu : le texte reste à l'écran et sur l'appareil.
        etatNote(`Non enregistrée — ${err.message}`, 'echec');
        bouton.disabled = false;
      } finally {
        noteEnVol = null;
      }
    };

    champ.addEventListener('input', () => {
      ecrireBrouillonNote(competence.id, champ.value);
      majCompteur();
      majBouton();
      clearTimeout(noteMinuteur);
      noteMinuteur = setTimeout(enregistrerLaNote, NOTE_DELAI_MS);
    });
    // Sortir du champ enregistre sans attendre la pause : c'est le geste qui signale
    // que l'on a fini d'écrire.
    champ.addEventListener('blur', enregistrerLaNote);
    bouton.addEventListener('click', enregistrerLaNote);

    majCompteur();
    if (modifiee()) {
      etatNote('Retrouvée sur cet appareil, pas encore enregistrée', '');
      bouton.disabled = false;
    } else if (texteNote(competence.id)) {
      const d = etat.notes[competence.id].maj_le;
      etatNote(`Enregistrée le ${new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}`, '');
    }
  }

  function carteRessource(r) {
    const meta = (r.type || []).join(' · ');
    const lien = r.url && /^https?:\/\//i.test(r.url) ? r.url : null;
    const contenu = `<span class="ressource-titre">${echapper(r.name || 'Sans titre')}</span>
      ${meta ? `<span class="ressource-meta">${echapper(meta)}</span>` : ''}`;
    return lien
      ? `<a class="ressource" href="${echapper(lien)}" target="_blank" rel="noopener">${contenu}</a>`
      : `<div class="ressource">${contenu}</div>`;
  }

  // Ressources en deux groupes. Une ressource propre à la compétence ne doit jamais
  // réapparaître parmi celles de la thématique — c'est le cas d'INT-01, dont l'unique
  // ressource est aussi celle d'Émotions.
  function sectionRessources(competence) {
    const parId = new Map(etat.referentiel.resources.map((r) => [r.id, r]));
    const propres = (competence.resources || []).map((id) => parId.get(id)).filter(Boolean);
    const idsPropres = new Set(propres.map((r) => r.id));
    const duTheme = etat.referentiel.resources.filter(
      (r) => r.themes?.includes(competence.theme) && !idsPropres.has(r.id)
    );

    // La majorité des compétences n'a rien : la section disparaît entièrement plutôt
    // que d'afficher un bloc vide ou un « aucune ressource » qui sonnerait comme un
    // manque.
    if (propres.length === 0 && duTheme.length === 0) return '';

    const groupe = (titre, liste) => liste.length === 0 ? '' : `
      <div class="ressources-groupe">
        ${titre ? `<p class="ressources-sous-label">${titre}</p>` : ''}
        <div class="ressources">${liste.map(carteRessource).join('')}</div>
      </div>`;

    return `<section class="panneau-section">
      <p class="panneau-label">Ressources</p>
      ${groupe(propres.length && duTheme.length ? 'Pour cette compétence' : '', propres)}
      ${groupe(propres.length ? 'Autres ressources de la thématique' : 'Ressources de la thématique', duTheme)}
    </section>`;
  }

  function escalier(competence, niveau, teinte) {
    const marches = [1, 2, 3].map((n) => {
      const classes = ['marche', 'marche-' + n];
      if (n === niveau) classes.push('marche-actuelle');
      else if (n < niveau) classes.push('marche-atteinte');
      return `<button type="button" class="${classes.join(' ')}" data-niveau="${n}"
                aria-pressed="${n === niveau}">
        <div class="marche-astre">${astreCran(n, teinte)}</div>
        <div>
          <p class="marche-palier">${echapper(etat.referentiel.scale[n])}
            ${n === niveau ? '<span class="marche-vous">Ton niveau</span>' : ''}</p>
          <p class="marche-enonce">${echapper(competence.statements[n] || '')}</p>
        </div>
      </button>`;
    }).join('');

    const note = niveau === 0
      ? "Coche la marche la plus haute qui est vraie pour toi."
      : (niveau < 3
        ? `La marche suivante : ${echapper(etat.referentiel.scale[niveau + 1])}. Reclique sur ta marche pour revenir en arrière.`
        : 'Tu es à la marche la plus haute. Reclique dessus pour revenir en arrière.');

    return `<section class="panneau-section">
      <p class="panneau-label">Où tu en es</p>
      <div class="escalier">${marches}</div>
      <p class="escalier-note">${note}</p>
    </section>`;
  }

  // Sélections. « Maintenant » est plafonné et réservé aux thématiques ouvertes ;
  // « plus tard » est libre et disponible partout, y compris en thématique fermée.
  function sectionSelections(competence) {
    const ouverte = estOuverte(competence.theme);
    const estMaintenant = brouillon.current.includes(competence.id);
    const estPlusTard = brouillon.later.includes(competence.id);
    const plein = brouillon.current.length >= MAX_MAINTENANT && !estMaintenant;

    let raison = '';
    if (!ouverte) raison = "Cette thématique n'est pas encore ouverte : tu peux la garder pour plus tard, et la travailler dès qu'elle se débloque.";
    else if (plein) raison = `Tu travailles déjà ${MAX_MAINTENANT} compétences ce mois. En choisir une autre te proposera laquelle remplacer.`;

    return `<section class="panneau-section">
      <p class="panneau-label">Ton intention</p>
      <div class="cibles">
        <button type="button" class="cible-btn cible-maintenant${estMaintenant ? ' active' : ''}"
          id="btn-maintenant" ${ouverte ? '' : 'disabled'} aria-pressed="${estMaintenant}">
          <span class="pastille"></span>${estMaintenant ? 'Je la travaille ce mois' : 'La travailler ce mois'}
        </button>
        <button type="button" class="cible-btn cible-plus-tard${estPlusTard ? ' active' : ''}"
          id="btn-plus-tard" aria-pressed="${estPlusTard}">
          <span class="pastille"></span>${estPlusTard ? 'Gardée pour plus tard' : 'Garder pour plus tard'}
        </button>
      </div>
      ${raison ? `<p class="cible-raison">${raison}</p>` : ''}
      <div id="zone-remplacement"></div>
    </section>`;
  }

  // Quatrième cible : plutôt qu'un refus sec qui obligerait à retrouver les trois
  // autres dans la carte pour en retirer une, on propose l'échange sur place.
  function proposerRemplacement(competence, apres) {
    const zone = document.getElementById('zone-remplacement');
    const actuelles = brouillon.current
      .map((code) => etat.referentiel.competencies.find((c) => c.id === code))
      .filter(Boolean);

    zone.innerHTML = `<div class="remplacement">
      <p>Tu travailles déjà trois compétences ce mois. Laquelle <b>${echapper(competence.name)}</b> remplace-t-elle ?</p>
      <div class="remplacement-liste">
        ${actuelles.map((c) => {
          const t = etat.referentiel.themes.find((x) => x.id === c.theme);
          return `<button type="button" class="remplacement-item" data-sortant="${echapper(c.id)}">
            ${echapper(c.name)}<span>${echapper(t ? t.name : '')}</span></button>`;
        }).join('')}
      </div>
      <button type="button" class="remplacement-annuler" id="remplacement-annuler">Aucune, annuler</button>
    </div>`;

    zone.querySelectorAll('[data-sortant]').forEach((btn) => {
      btn.addEventListener('click', () => {
        remplacerMaintenant(btn.dataset.sortant, competence.id);
        if (apres) apres(); else rafraichirPanneau(competence.id);
      });
    });
    document.getElementById('remplacement-annuler').addEventListener('click', () => { zone.innerHTML = ''; });
  }

  let competenceAffichee = null;
  let themeAffiche = null;

  // ============================================================
  // PANNEAU DE THÉMATIQUE
  // ============================================================
  // Une thématique verrouillée est entièrement consultable : définition, compétences,
  // énoncés, ressources, auto-évaluation et « plus tard ». Seule l'action « maintenant »
  // est bloquée. C'est ce qui en fait un horizon et non un mur.
  function ouvrirTheme(themeId, idDimension) {
    const theme = etat.referentiel.themes.find((t) => t.id === themeId);
    if (!theme) return;
    const dimension = etat.referentiel.dimensions.find((d) => d.id === idDimension);
    const teinte = TEINTES_HEX[idDimension] || '#f0ebe0';
    const ouverte = estOuverte(themeId);
    const infos = etat.computed.themes[themeId] || {};

    themeAffiche = { id: themeId, dimension: idDimension };
    competenceAffichee = null;

    const competences = etat.referentiel.competencies.filter((c) => c.theme === themeId);
    const items = competences.map((c) => {
      const niveau = brouillon.levels[c.id] ?? 0;
      const marques = [
        brouillon.current.includes(c.id) ? '<span class="comp-marque comp-marque-maintenant">Ce mois</span>' : '',
        brouillon.later.includes(c.id) ? '<span class="comp-marque comp-marque-plus-tard">Plus tard</span>' : '',
      ].filter(Boolean).join('');
      return `<button type="button" class="comp-item" data-competence="${echapper(c.id)}">
        <span class="comp-astre">${astreCran(Math.max(niveau, 1), ouverte ? teinte : '#8d8677')
          .replace('fill-opacity="' + CRANS[Math.max(niveau, 1)].opacite + '"', `fill-opacity="${niveau === 0 ? 0.22 : CRANS[niveau].opacite}"`)}</span>
        <span>
          <span class="comp-nom">${echapper(c.name)}</span>
          <span class="comp-marques">${pastilleDifficulte(c)}${marqueNote(c.id)}${marques}</span>
        </span>
        <span class="comp-palier">${niveau === 0 ? 'À évaluer' : echapper(etat.referentiel.scale[niveau])}</span>
      </button>`;
    }).join('');

    elPanneau.style.setProperty('--teinte-p', teinte);
    elPanneauTete.innerHTML = `
      <p class="panneau-fil">${echapper(dimension ? dimension.name : '')} <span>›</span> <b>Thématique</b></p>
      <h2 class="panneau-titre" id="panneau-titre">${echapper(theme.name)}</h2>
      ${theme.definition ? `<p class="panneau-def">${echapper(theme.definition)}</p>` : ''}
    `;

    const horizon = ouverte ? '' : `
      <section class="panneau-section">
        <div class="horizon">
          <span class="horizon-marque">${astreCran(2, '#8d8677')}</span>
          <p class="horizon-texte">
            <b>Pas encore ouverte</b>
            ${echapper(infos.unlock_hint || '')}
            <br><br>Tu peux déjà tout lire ici, t'y évaluer, et garder une compétence pour plus tard.
          </p>
        </div>
      </section>`;

    elPanneauCorps.innerHTML = horizon + `
      <section class="panneau-section">
        <p class="panneau-label">${competences.length} compétence${competences.length > 1 ? 's' : ''}</p>
        <div class="liste-comp">${items}</div>
      </section>`;
    elPanneauCorps.scrollTop = 0;

    elPanneauCorps.querySelectorAll('.comp-item[data-competence]').forEach((btn) => {
      btn.addEventListener('click', () => ouvrirCompetence(btn.dataset.competence, idDimension));
    });

    afficherPanneau();
    document.body.dataset.panneau = 'theme:' + theme.code;
  }

  // Le masquage est différé le temps de l'animation de fermeture. Rouvrir pendant ce
  // délai — enchaîner deux étoiles, par exemple — laissait le minuteur masquer le
  // panneau fraîchement ouvert : il apparaissait puis disparaissait aussitôt.
  let minuteurFermeture = null;

  // ============================================================
  // PANNEAU « MON MOIS » — les sélections rassemblées
  // ============================================================
  // Une wishlist éparpillée sur cinq dimensions est inutilisable : le membre coche et
  // ne retrouve jamais. Ce panneau est un RACCOURCI vers la carte, pas une seconde
  // interface : chaque entrée y ramène.
  const elBtnMois = document.getElementById('btn-mois');
  const elBtnMoisCompte = document.getElementById('btn-mois-compte');

  function majBoutonMois() {
    const n = brouillon.current.length + brouillon.later.length;
    elBtnMois.hidden = n === 0;
    elBtnMoisCompte.textContent = brouillon.current.length + '/' + MAX_MAINTENANT;
  }

  function dimensionDe(competence) {
    const t = etat.referentiel.themes.find((x) => x.id === competence.theme);
    return etat.referentiel.dimensions.find((d) => d.name === t?.dimension);
  }

  function ligneSelection(code, options = {}) {
    const c = etat.referentiel.competencies.find((x) => x.id === code);
    if (!c) return '';
    const t = etat.referentiel.themes.find((x) => x.id === c.theme);
    const niveau = brouillon.levels[code] ?? 0;
    const ouverte = estOuverte(c.theme);
    const etatTexte = options.cible
      ? (niveau === 0 ? 'À évaluer' : echapper(etat.referentiel.scale[niveau]))
      : (ouverte
          ? `<span>Accessible</span>`
          : `<span class="sel-verrou">Thématique à débloquer</span>`);

    // La promotion n'a de sens que si la thématique est ouverte : c'est la seule
    // contrainte du serveur sur « maintenant ».
    const promouvoir = (!options.cible && ouverte)
      ? `<button type="button" class="sel-promouvoir" data-promouvoir="${echapper(code)}">La travailler ce mois</button>`
      : '';

    return `<div class="sel-item${options.cible ? ' cible' : ''}">
      <button type="button" class="sel-nom" data-aller="${echapper(code)}">
        ${echapper(c.name)}<small>${echapper(t ? t.name : '')}${aUneNote(code) ? ' · note' : ''}</small>
      </button>
      <span class="sel-etat">${etatTexte}</span>
      ${promouvoir}
    </div>`;
  }

  function ouvrirMois() {
    competenceAffichee = null;
    themeAffiche = null;
    elPanneau.style.setProperty('--teinte-p', '#c9a661');

    elPanneauTete.innerHTML = `
      <p class="panneau-fil"><b>Tes choix</b></p>
      <h2 class="panneau-titre" id="panneau-titre">Mon mois</h2>
      <p class="panneau-def">Ce que tu travailles maintenant, et ce que tu gardes pour la suite.</p>`;

    const cibles = brouillon.current.length
      ? brouillon.current.map((c) => ligneSelection(c, { cible: true })).join('')
      : `<p class="sel-vide">Aucune compétence choisie pour ce mois. Trois au maximum : c'est peu, et c'est voulu — mieux vaut trois compétences travaillées qu'une liste d'intentions.</p>`;

    // « Plus tard » groupé par dimension : c'est ce qui transforme un fourre-tout en
    // file d'attente lisible.
    const parDim = new Map();
    brouillon.later.forEach((code) => {
      const c = etat.referentiel.competencies.find((x) => x.id === code);
      if (!c) return;
      const d = dimensionDe(c);
      const cle = d ? d.id : '?';
      if (!parDim.has(cle)) parDim.set(cle, { dimension: d, codes: [] });
      parDim.get(cle).codes.push(code);
    });
    const ordre = etat.referentiel.dimensions.map((d) => d.id);
    const groupes = [...parDim.entries()]
      .sort((a, b) => ordre.indexOf(a[0]) - ordre.indexOf(b[0]))
      .map(([id, g]) => `
        <p class="sel-dim" style="--h: ${TEINTES_HEX[id] || '#f0ebe0'}"><i></i>${echapper(g.dimension ? g.dimension.name : '')}</p>
        ${g.codes.map((c) => ligneSelection(c)).join('')}`).join('');

    const plusTard = brouillon.later.length
      ? groupes
      : `<p class="sel-vide">Rien en attente. Sur n'importe quelle compétence, « Garder pour plus tard » la range ici — y compris dans une thématique encore fermée.</p>`;

    elPanneauCorps.innerHTML = `
      <section class="panneau-section sel-groupe">
        <p class="panneau-label">Ce mois — ${brouillon.current.length}/${MAX_MAINTENANT}</p>
        ${cibles}
      </section>
      <section class="panneau-section sel-groupe">
        <p class="panneau-label">Pour plus tard${brouillon.later.length ? ' — ' + brouillon.later.length : ''}</p>
        ${plusTard}
      </section>
      <div id="zone-remplacement"></div>
      <p class="sel-rappel">Touche une compétence pour la retrouver dans sa constellation.</p>`;
    elPanneauCorps.scrollTop = 0;

    elPanneauCorps.querySelectorAll('[data-aller]').forEach((btn) => {
      btn.addEventListener('click', () => allerVersCompetence(btn.dataset.aller));
    });
    elPanneauCorps.querySelectorAll('[data-promouvoir]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.promouvoir;
        const competence = etat.referentiel.competencies.find((c) => c.id === code);
        if (brouillon.current.length >= MAX_MAINTENANT) {
          proposerRemplacement(competence, () => ouvrirMois());
          document.getElementById('zone-remplacement').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
        basculerMaintenant(code);
        ouvrirMois();
      });
    });

    afficherPanneau();
    document.body.dataset.panneau = 'mois';
  }

  // Rejoindre une compétence dans la carte : déplie sa dimension, dessine sa
  // constellation au besoin, puis ouvre son panneau.
  function allerVersCompetence(code) {
    const competence = etat.referentiel.competencies.find((c) => c.id === code);
    if (!competence) return;
    const d = dimensionDe(competence);
    if (!d) return;
    if (etat.dimensionOuverte !== d.id) basculerDimension(d.id);
    const zone = elDimensions.querySelector(`[data-dimension="${d.id}"]`);
    if (zone) zone.scrollIntoView({ block: 'start', behavior: 'smooth' });
    ouvrirCompetence(code, d.id);
  }

  elBtnMois.addEventListener('click', ouvrirMois);

  // ============================================================
  // M'ÉVALUER — défilement compétence par compétence
  // ============================================================
  // Prend une LISTE DE CODES en paramètre, jamais une dimension : le même écran sert
  // au positionnement initial d'une dimension entière et aux 7 compétences du thème du
  // mois en séance. L'appelant décide ce qu'il y met.
  //
  // L'enregistrement est proposé à la fin de chaque bloc, pour qu'un membre puisse s'y
  // reprendre en plusieurs fois sans rien perdre.
  const TAILLE_BLOC = 8;

  let situer = null;

  function ouvrirMeSituer({ codes, titre, teinte = '#c9a661', depart = 0 }) {
    const liste = codes.filter((c) => etat.referentiel.competencies.some((x) => x.id === c));
    if (liste.length === 0) return;

    situer = {
      codes: liste,
      titre,
      teinte,
      index: depart,
      // Position de départ du bloc courant : sert à ne proposer l'enregistrement
      // qu'au bout d'une portion, et à afficher un bilan de ce qui vient d'être fait.
      debutBloc: depart,
      situeesAuDebut: liste.filter((c) => (brouillon.levels[c] ?? 0) > 0).length,
    };
    competenceAffichee = null;
    themeAffiche = null;
    elPanneau.style.setProperty('--teinte-p', teinte);
    rendreMeSituer();
    afficherPanneau();
    document.body.dataset.panneau = 'situer';
  }

  function finDeBloc(i) {
    return i > situer.debutBloc && (i - situer.debutBloc) % TAILLE_BLOC === 0;
  }

  function rendreMeSituer() {
    if (!situer) return;

    // Fin de parcours ou fin de bloc : on s'arrête pour proposer d'enregistrer.
    if (situer.index >= situer.codes.length || finDeBloc(situer.index)) {
      rendreBilanMeSituer();
      return;
    }

    const code = situer.codes[situer.index];
    const c = etat.referentiel.competencies.find((x) => x.id === code);
    const theme = etat.referentiel.themes.find((t) => t.id === c.theme);
    const niveau = brouillon.levels[code] ?? 0;
    const situees = situer.codes.filter((x) => (brouillon.levels[x] ?? 0) > 0).length;

    elPanneauTete.innerHTML = `
      <p class="panneau-fil">M'évaluer <span>›</span> <b>${echapper(situer.titre)}</b></p>
      <div class="situer-progres">
        <span class="situer-jauge"><i style="width:${Math.round((situer.index / situer.codes.length) * 100)}%"></i></span>
        <span class="situer-compte">${situer.index + 1} / ${situer.codes.length}</span>
      </div>`;

    elPanneauCorps.innerHTML = `
      <div class="situer">
        <p class="situer-fil">${echapper(theme ? theme.name : '')}</p>
        <h2 class="situer-nom" id="panneau-titre">${echapper(c.name)}</h2>
        ${pastilleDifficulte(c)}
        ${c.definition ? `<p class="situer-def">${echapper(c.definition)}</p>` : ''}
        <div style="margin-top:18px">${escalier(c, niveau, situer.teinte)}</div>
        <div class="situer-pied">
          <button type="button" class="situer-btn" id="situer-precedent" ${situer.index === 0 ? 'disabled' : ''}>← Précédente</button>
          <button type="button" class="situer-btn situer-passer" id="situer-passer">
            ${niveau > 0 ? 'Suivante →' : 'Passer →'}
          </button>
          <p class="situer-astuce">${niveau > 0
            ? `Déjà évalué à « ${echapper(etat.referentiel.scale[niveau])} ». Reclique sur ta marche pour l'effacer.`
            : 'Coche une marche, ou passe : tu pourras y revenir.'}</p>
        </div>
      </div>`;
    elPanneauCorps.scrollTop = 0;

    // Cocher une marche fait avancer tout seul : c'est ce qui rend le parcours fluide.
    elPanneauCorps.querySelectorAll('.marche[data-niveau]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const n = Number(btn.dataset.niveau);
        const avant = brouillon.levels[code] ?? 0;
        definirNiveau(code, n);
        // Décocher (recliquer sur sa propre marche) ne doit pas faire avancer :
        // le membre corrige, il ne valide pas.
        if (avant === n) rendreMeSituer();
        else avancerMeSituer();
      });
    });
    document.getElementById('situer-passer').addEventListener('click', avancerMeSituer);
    document.getElementById('situer-precedent').addEventListener('click', () => {
      situer.index = Math.max(0, situer.index - 1);
      rendreMeSituer();
    });
  }

  function avancerMeSituer() {
    situer.index += 1;
    rendreMeSituer();
  }

  function rendreBilanMeSituer() {
    const termine = situer.index >= situer.codes.length;
    const situees = situer.codes.filter((x) => (brouillon.levels[x] ?? 0) > 0).length;
    const nouvelles = Math.max(0, situees - situer.situeesAuDebut);
    const restantes = situer.codes.length - situer.index;

    elPanneauTete.innerHTML = `
      <p class="panneau-fil">M'évaluer <span>›</span> <b>${echapper(situer.titre)}</b></p>
      <div class="situer-progres">
        <span class="situer-jauge"><i style="width:${Math.round((situer.index / situer.codes.length) * 100)}%"></i></span>
        <span class="situer-compte">${situer.index} / ${situer.codes.length}</span>
      </div>`;

    elPanneauCorps.innerHTML = `
      <div class="situer-bilan">
        <span class="mark">✧</span>
        <h3>${termine ? 'Tu as parcouru toute la liste.' : 'Une pause ?'}</h3>
        <p>${termine
          ? "Rien n'est encore enregistré. Tu peux le faire maintenant, ou continuer à explorer la carte."
          : `Il te reste ${restantes} compétence${restantes > 1 ? 's' : ''}. Enregistre ce que tu viens de faire, tu reprendras où tu en es.`}</p>
        <dl class="situer-bilan-chiffres">
          <div><dt>Évaluées à l'instant</dt><dd>${nouvelles}</dd></div>
          <div><dt>Évaluées en tout</dt><dd>${situees}<span style="color:var(--stone);font-size:15px"> / ${situer.codes.length}</span></dd></div>
        </dl>
        <div class="situer-pied" style="justify-content:center">
          ${termine ? '' : '<button type="button" class="situer-btn" id="situer-continuer">Continuer →</button>'}
          <button type="button" class="situer-btn" id="situer-enregistrer"
            style="border-color:var(--gold);background:rgba(201,166,97,.16);color:var(--gold-bright)">Enregistrer</button>
          <button type="button" class="situer-btn" id="situer-fermer">Revenir à la carte</button>
        </div>
      </div>`;
    elPanneauCorps.scrollTop = 0;

    const continuer = document.getElementById('situer-continuer');
    if (continuer) continuer.addEventListener('click', () => {
      situer.debutBloc = situer.index;
      situer.situeesAuDebut = situer.codes.filter((x) => (brouillon.levels[x] ?? 0) > 0).length;
      rendreMeSituer();
    });
    document.getElementById('situer-enregistrer').addEventListener('click', async () => {
      await enregistrer();
      situer.situeesAuDebut = situer.codes.filter((x) => (brouillon.levels[x] ?? 0) > 0).length;
      rendreBilanMeSituer();
    });
    document.getElementById('situer-fermer').addEventListener('click', fermerPanneau);
  }

  // ============================================================
  // TABLEAU DE SYNTHÈSE
  // ============================================================
  // Raccourci vers la carte, comme « Mon mois » : rien ne s'y modifie. Le clic sur une
  // ligne ouvre le panneau de compétence — une seule porte pour écrire.
  const FILTRES = {
    tout:      { libelle: 'Tout',            garde: () => true },
    cibles:    { libelle: 'Mes cibles',      garde: (c) => brouillon.current.includes(c.id) || brouillon.later.includes(c.id) },
    nonSituees:{ libelle: 'Non évaluées',     garde: (c) => (brouillon.levels[c.id] ?? 0) === 0 },
    ouvertes:  { libelle: 'Thém. ouvertes',  garde: (c) => estOuverte(c.theme) },
    // Les filtres de difficulté sont ajoutés par appliquerConfigClub() : leurs libellés
    // sont des réglages de club, pas des constantes d'interface.
  };

  let synFiltres = new Set(['tout']);
  let synDeplies = new Set();

  // Les filtres se cumulent, sauf « Tout » qui les remplace tous. Croiser « Fondamental »
  // et « Non évaluées » est justement le cas qui donne son sens à la pastille.
  function synGarde(c) {
    if (synFiltres.has('tout')) return true;
    return [...synFiltres].every((f) => FILTRES[f].garde(c));
  }

  function repartition(codes, teinte) {
    const n = codes.length || 1;
    const compte = [0, 0, 0, 0];
    codes.forEach((code) => { compte[brouillon.levels[code] ?? 0] += 1; });
    return `<span class="syn-repartition" style="--h:${teinte}" aria-hidden="true">
      ${compte.map((v, i) => v ? `<i class="syn-seg${i}" style="width:${(v / n) * 100}%"></i>` : '').join('')}
    </span>`;
  }

  function ligneCompetence(c) {
    const niveau = brouillon.levels[c.id] ?? 0;
    const marques = [
      pastilleDifficulte(c),
      marqueNote(c.id),
      brouillon.current.includes(c.id) ? '<span class="comp-marque comp-marque-maintenant">Ce mois</span>' : '',
      brouillon.later.includes(c.id) ? '<span class="comp-marque comp-marque-plus-tard">Plus tard</span>' : '',
    ].filter(Boolean).join('');
    return `<button type="button" class="syn-comp" data-aller="${echapper(c.id)}">
      <span class="syn-comp-nom">${echapper(c.name)}</span>
      <span class="syn-comp-niveau${niveau ? ' situe' : ''}">${niveau ? echapper(etat.referentiel.scale[niveau]) : 'À évaluer'}</span>
      ${marques ? `<span class="syn-comp-marques">${marques}</span>` : ''}
    </button>`;
  }

  // Ordre de lecture du référentiel : dimension canonique, puis thématique, puis rang
  // de la compétence dans sa thématique. C'est l'ordre dans lequel tout ce qui
  // s'adresse au membre présente les compétences.
  function ordreDeLecture(competences) {
    const rangDimension = new Map(etat.referentiel.dimensions.map((d, i) => [d.name, i]));
    const rangTheme = new Map();
    etat.referentiel.themes
      .slice()
      .sort((a, b) => (rangDimension.get(a.dimension) ?? 99) - (rangDimension.get(b.dimension) ?? 99)
        || (a.order ?? 0) - (b.order ?? 0))
      .forEach((t, i) => rangTheme.set(t.id, i));

    // `Ordre` vide = à la fin de sa thématique, jamais en tête : c'est le cas normal
    // d'une compétence qu'on vient d'ajouter dans Notion. Même règle que côté serveur.
    const rangComp = (c) => c.order ?? Number.MAX_SAFE_INTEGER;
    return competences.slice().sort((a, b) =>
      (rangTheme.get(a.theme) ?? 9999) - (rangTheme.get(b.theme) ?? 9999)
      || rangComp(a) - rangComp(b)
      || a.id.localeCompare(b.id));
  }

  function ouvrirSynthese() {
    competenceAffichee = null;
    themeAffiche = null;
    situer = null;
    elPanneau.style.setProperty('--teinte-p', '#c9a661');

    const retenues = etat.referentiel.competencies.filter(synGarde);
    // Le parcours doit suivre l'ordre du TABLEAU, pas celui de la liste plate renvoyée
    // par Notion — qui trie par code et donne donc AUT avant MOI. Un membre qui lit ses
    // trous de haut en bas puis clique « M'évaluer sur ces N compétences » attend de
    // les retrouver dans le même ordre : dimensions en ordre canonique, puis
    // thématiques dans l'ordre du référentiel.
    const codesRetenus = ordreDeLecture(retenues).map((c) => c.id);

    const chips = Object.entries(FILTRES).map(([cle, f]) => {
      const n = etat.referentiel.competencies.filter(f.garde).length;
      return `<button type="button" class="syn-filtre${synFiltres.has(cle) ? ' actif' : ''}" data-filtre="${cle}">
        ${echapper(f.libelle)}<span class="n">${n}</span></button>`;
    }).join('');

    elPanneauTete.innerHTML = `
      <p class="panneau-fil"><b>Vue d'ensemble</b></p>
      <h2 class="panneau-titre" id="panneau-titre">Où j'en suis</h2>
      <div class="syn-filtres">${chips}</div>`;

    // Le rattrapage naturel : une fois les trous visibles, on va les combler.
    const actionSituer = (synFiltres.has('nonSituees') && codesRetenus.length > 0)
      ? `<div class="syn-action"><button type="button" class="dimension-situer" id="syn-situer" style="--teinte:#c9a661">
           M'évaluer sur ces ${codesRetenus.length} compétences
         </button></div>`
      : '';

    const corps = etat.referentiel.dimensions.map((d) => {
      const teinte = TEINTES_HEX[d.id];
      const themes = etat.referentiel.themes
        .filter((t) => t.dimension === d.name)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      const blocsThemes = themes.map((t) => {
        const comps = retenues.filter((c) => c.theme === t.id);
        if (comps.length === 0) return '';
        const codes = comps.map((c) => c.id);
        const situees = codes.filter((x) => (brouillon.levels[x] ?? 0) > 0).length;
        const ouverteT = estOuverte(t.id);
        const cle = 'T:' + t.id;
        return `<div class="syn-theme${synDeplies.has(cle) ? ' syn-ouvert' : ''}" data-cle="${cle}">
          <button type="button" class="syn-ligne" data-plier="${cle}">
            <span class="syn-nom">${echapper(t.name)}</span>
            <span class="syn-compte">${situees}/${codes.length} évaluées${ouverteT ? '' : ' · '}</span>
            ${ouverteT ? '' : '<span class="syn-verrou">à débloquer</span>'}
            <span class="syn-chev">▾</span>
            ${repartition(codes, teinte)}
          </button>
          <div class="syn-corps">${comps.map(ligneCompetence).join('')}</div>
        </div>`;
      }).join('');

      if (!blocsThemes) return '';
      const codesDim = retenues.filter((c) => themes.some((t) => t.id === c.theme)).map((c) => c.id);
      const situeesDim = codesDim.filter((x) => (brouillon.levels[x] ?? 0) > 0).length;
      const cleD = 'D:' + d.id;
      return `<section class="syn-dim${synDeplies.has(cleD) ? ' syn-ouvert' : ''}" data-cle="${cleD}" style="--h:${teinte}">
        <button type="button" class="syn-ligne" data-plier="${cleD}">
          <span class="syn-nom">${echapper(d.name)}</span>
          <span class="syn-compte">${situeesDim}/${codesDim.length} évaluées</span>
          <span class="syn-chev">▾</span>
          ${repartition(codesDim, teinte)}
        </button>
        <div class="syn-corps">${blocsThemes}</div>
      </section>`;
    }).join('');

    elPanneauCorps.innerHTML = actionSituer
      + (corps || `<p class="syn-vide">Aucune compétence ne correspond à ce croisement de filtres.</p>`);
    elPanneauCorps.scrollTop = 0;

    elPanneauCorps.querySelectorAll('[data-plier]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const cle = btn.dataset.plier;
        if (synDeplies.has(cle)) synDeplies.delete(cle); else synDeplies.add(cle);
        ouvrirSynthese();
      });
    });
    elPanneauCorps.querySelectorAll('[data-aller]').forEach((btn) => {
      btn.addEventListener('click', () => allerVersCompetence(btn.dataset.aller));
    });
    const btnSituer = document.getElementById('syn-situer');
    if (btnSituer) btnSituer.addEventListener('click', () => ouvrirMeSituer({
      codes: codesRetenus, titre: 'Mes compétences non évaluées', teinte: '#c9a661',
    }));

    elPanneauTete.querySelectorAll('[data-filtre]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const cle = btn.dataset.filtre;
        if (cle === 'tout') synFiltres = new Set(['tout']);
        else {
          synFiltres.delete('tout');
          if (synFiltres.has(cle)) synFiltres.delete(cle); else synFiltres.add(cle);
          if (synFiltres.size === 0) synFiltres = new Set(['tout']);
        }
        // Un filtre actif sans rien de déplié n'apprend rien : on ouvre les dimensions
        // qui ont des résultats, sans forcer l'ouverture des thématiques.
        if (!synFiltres.has('tout')) {
          etat.referentiel.dimensions.forEach((d) => synDeplies.add('D:' + d.id));
        }
        ouvrirSynthese();
      });
    });

    afficherPanneau();
    document.body.dataset.panneau = 'synthese';
  }

  document.getElementById('btn-synthese').addEventListener('click', ouvrirSynthese);

  function afficherPanneau() {
    clearTimeout(minuteurFermeture);
    minuteurFermeture = null;
    const etaitFerme = elVoile.hidden || !elVoile.classList.contains('visible');
    if (etaitFerme) {
      if (elVoile.hidden) dernierFocus = document.activeElement;
      elVoile.hidden = false;
      requestAnimationFrame(() => elVoile.classList.add('visible'));
      document.body.style.overflow = 'hidden';
      document.getElementById('panneau-fermer').focus();
    }
  }


  function brancherPanneau(competence) {
    elPanneauCorps.querySelectorAll('.marche[data-niveau]').forEach((btn) => {
      btn.addEventListener('click', () => {
        definirNiveau(competence.id, Number(btn.dataset.niveau));
        rafraichirPanneau(competence.id);
      });
    });

    const btnMaintenant = document.getElementById('btn-maintenant');
    if (btnMaintenant) btnMaintenant.addEventListener('click', () => {
      const dejaCible = brouillon.current.includes(competence.id);
      if (!dejaCible && brouillon.current.length >= MAX_MAINTENANT) {
        proposerRemplacement(competence);
        return;
      }
      basculerMaintenant(competence.id);
      rafraichirPanneau(competence.id);
    });

    const btnPlusTard = document.getElementById('btn-plus-tard');
    if (btnPlusTard) btnPlusTard.addEventListener('click', () => {
      basculerPlusTard(competence.id);
      rafraichirPanneau(competence.id);
    });
  }

  // Redessine le panneau sur place, en gardant la position de lecture : le membre ne
  // doit pas être renvoyé en haut à chaque clic sur une marche.
  function rafraichirPanneau(code) {
    if (competenceAffichee && competenceAffichee.code === code) {
      const origine = themeAffiche;
      ouvrirCompetence(code, competenceAffichee.dimension, true);
      themeAffiche = origine;
    }
  }

  function ouvrirCompetence(code, idDimension, conserverDefilement = false) {
    const competence = etat.referentiel.competencies.find((c) => c.id === code);
    if (!competence) return;
    competenceAffichee = { code, dimension: idDimension };
    const theme = etat.referentiel.themes.find((t) => t.id === competence.theme);
    const dimension = etat.referentiel.dimensions.find((d) => d.id === idDimension);
    const teinte = TEINTES_HEX[idDimension] || '#f0ebe0';
    const niveau = brouillon.levels[code] ?? 0;

    elPanneau.style.setProperty('--teinte-p', teinte);
    const retour = themeAffiche && themeAffiche.id === competence.theme;
    elPanneauTete.innerHTML = `
      ${retour ? `<button type="button" class="panneau-retour" id="panneau-retour">← ${echapper(theme ? theme.name : '')}</button>` : ''}
      <p class="panneau-fil">${echapper(dimension ? dimension.name : '')} <span>›</span> <b>${echapper(theme ? theme.name : '')}</b></p>
      <h2 class="panneau-titre" id="panneau-titre">${echapper(competence.name)}</h2>
      ${competence.definition ? `<p class="panneau-def">${echapper(competence.definition)}</p>` : ''}
      ${pastilleDifficulte(competence, 'panneau-diff')}
    `;
    elPanneauCorps.innerHTML = escalier(competence, niveau, teinte)
      + sectionSelections(competence)
      + sectionRessources(competence)
      + blocNote(competence);
    brancherPanneau(competence);
    brancherNote(competence);
    if (!conserverDefilement) elPanneauCorps.scrollTop = 0;

    const btnRetour = document.getElementById('panneau-retour');
    if (btnRetour) btnRetour.addEventListener('click', () => ouvrirTheme(themeAffiche.id, themeAffiche.dimension));

    afficherPanneau();
    document.body.dataset.panneau = code;
  }

  function fermerPanneau() {
    competenceAffichee = null;
    themeAffiche = null;
    situer = null;
    elVoile.classList.remove('visible');
    document.body.style.overflow = '';
    delete document.body.dataset.panneau;
    minuteurFermeture = setTimeout(() => { elVoile.hidden = true; minuteurFermeture = null; }, 280);
    if (dernierFocus && dernierFocus.focus) dernierFocus.focus();
  }

  document.getElementById('panneau-fermer').addEventListener('click', fermerPanneau);
  elVoile.addEventListener('click', (e) => { if (e.target === elVoile) fermerPanneau(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !elVoile.hidden) fermerPanneau();
  });

  // ============================================================
  // RAFRAÎCHISSEMENT DE LA CARTE
  // ============================================================
  // Retour immédiat : l'étoile change au clic, pas au retour du serveur.
  function rafraichirEtoiles() {
    document.querySelectorAll('.etoile[data-competence]').forEach((g) => {
      const code = g.dataset.competence;
      const competence = etat.referentiel.competencies.find((c) => c.id === code);
      if (!competence) return;
      const zone = g.closest('[data-constellation]');
      const teinte = TEINTES_HEX[zone?.dataset.constellation] || '#f0ebe0';
      const verrouillee = !estOuverte(competence.theme);
      const c = CRANS[brouillon.levels[code] ?? 0] ?? CRANS[0];
      const couleur = verrouillee ? '#8d8677' : teinte;

      const corps = g.querySelector('.etoile-corps');
      corps.setAttribute('r', c.r);
      corps.setAttribute('fill', couleur);
      corps.setAttribute('fill-opacity', (c.opacite * (verrouillee ? 0.5 : 1)).toFixed(2));

      let halo = g.querySelector('.etoile-halo');
      if (c.halo > 0) {
        if (!halo) {
          halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          halo.setAttribute('class', 'etoile-halo');
          halo.setAttribute('cx', corps.getAttribute('cx'));
          halo.setAttribute('cy', corps.getAttribute('cy'));
          g.insertBefore(halo, g.firstChild);
        }
        halo.setAttribute('r', c.halo);
        halo.setAttribute('fill', couleur);
        halo.setAttribute('fill-opacity', (c.haloOpacite * (verrouillee ? 0.45 : 1)).toFixed(3));
      } else if (halo) {
        halo.remove();
      }
    });
  }

  function redessinerConstellations() {
    elDimensions.querySelectorAll('[data-constellation][data-rendu="oui"]').forEach((zone) => {
      zone.dataset.rendu = '';
      zone.innerHTML = '';
      rendreConstellation(zone.dataset.constellation);
    });
    const ouvertes = Object.values(etat.computed.themes).filter((t) => t.status === 'open').length;
    elHeaderEtatTexte.textContent = `${ouvertes} thématique${ouvertes > 1 ? 's' : ''} à explorer`;
  }

  // ============================================================
  // ENREGISTREMENT
  // ============================================================
  const elBarre = document.getElementById('barre');
  const elBarreTexte = document.getElementById('barre-texte');
  const elBtnEnregistrer = document.getElementById('btn-enregistrer');
  const elBandeau = document.getElementById('bandeau');
  const elLibelle = document.getElementById('barre-libelle');
  const elDernierPoint = document.getElementById('dernier-point');

  // Les snapshots créés avant l'ajout de ce champ n'ont pas de libellé. Plutôt que de
  // les afficher « sans nom », on les nomme par leur date : l'historique reste lisible.
  function libelleSnapshot(snapshot) {
    if (!snapshot) return null;
    if (snapshot.libelle) return snapshot.libelle;
    const d = new Date(snapshot.cree_le);
    return 'Point du ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function majDernierPoint() {
    const nom = libelleSnapshot(etat.snapshot);
    if (!nom) { elDernierPoint.hidden = true; return; }
    elDernierPoint.textContent = `Dernier point enregistré : ${nom}`;
    elDernierPoint.hidden = false;
  }

  function majBarre() {
    if (!estModifie()) { elBarre.classList.remove('visible'); return; }
    const c = changements();
    const bouts = [];
    if (c.niveaux.length) bouts.push(`<b>${c.niveaux.length}</b> positionnement${c.niveaux.length > 1 ? 's' : ''}`);
    if (c.cibles) bouts.push('tes cibles du mois');
    if (c.plusTard) bouts.push('ta liste « plus tard »');
    elBarreTexte.innerHTML = `Modifié : ${bouts.join(', ')}. Rien n'est encore enregistré.`;
    elBarre.classList.add('visible');
  }

  let minuteurBandeau = null;
  function bandeau(titre, texte, variante, action) {
    elBandeau.innerHTML = `<b>${echapper(titre)}</b>${echapper(texte)}`
      + (action ? `<br><button type="button" id="bandeau-action">${echapper(action.libelle)}</button>` : '');
    elBandeau.className = 'bandeau visible ' + variante;
    if (action) document.getElementById('bandeau-action').addEventListener('click', () => {
      elBandeau.classList.remove('visible'); action.faire();
    });
    clearTimeout(minuteurBandeau);
    // Un échec reste affiché : le membre doit pouvoir le lire et réessayer.
    if (variante !== 'echec') minuteurBandeau = setTimeout(() => elBandeau.classList.remove('visible'), 4200);
  }

  async function enregistrer() {
    const retires = elaguerCiblesFermees();
    elBtnEnregistrer.disabled = true;
    elBtnEnregistrer.textContent = 'Enregistrement…';

    try {
      const reponse = await fetch('/api/snapshot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          uuid: CLIENT_ID,
          // Reprise de la version que le serveur vient de servir, jamais une constante
          // écrite en dur : elle avait déjà divergé au passage du référentiel en v3.
          referential_version: etat.referentiel.version,
          label: elLibelle.value.trim() || null,
          levels: brouillon.levels,
          selections: { current: brouillon.current, later: brouillon.later },
        }),
      });
      if (!reponse.ok) {
        const d = await reponse.json().catch(() => ({}));
        throw new Error(d.erreur || `Le serveur a répondu ${reponse.status}`);
      }
      const data = await reponse.json();

      // Le serveur est l'autorité : son état calculé remplace l'aperçu local.
      etat.snapshot = data.snapshot;
      etat.computed = data.computed;
      const sel = data.snapshot.blob.selections;
      reference = { levels: { ...data.snapshot.blob.levels }, current: [...sel.current], later: [...sel.later] };
      brouillon = { levels: { ...reference.levels }, current: [...reference.current], later: [...reference.later] };

      try { localStorage.removeItem(cleBrouillon()); } catch {}
      elLibelle.value = '';
      majDernierPoint();
      majBarre();
      majBoutonMois();
      redessinerConstellations();
      if (competenceAffichee) rafraichirPanneau(competenceAffichee.code);

      bandeau('Ton sphérier est enregistré.',
        retires > 0
          ? `${retires} cible${retires > 1 ? 's ont' : ' a'} été retirée${retires > 1 ? 's' : ''} : sa thématique s'est refermée.`
          : 'Tu peux fermer cette page.',
        'succes');
    } catch (err) {
      // Rien n'est perdu : le brouillon local tient, l'écran garde les modifications.
      bandeau("L'enregistrement n'a pas abouti.",
        `${err.message}. Tes modifications sont conservées sur cet appareil : réessaie quand la connexion revient.`,
        'echec', { libelle: 'Réessayer', faire: enregistrer });
    } finally {
      elBtnEnregistrer.disabled = false;
      elBtnEnregistrer.textContent = 'Enregistrer';
    }
  }

  elBtnEnregistrer.addEventListener('click', enregistrer);
  document.getElementById('btn-annuler').addEventListener('click', () => {
    brouillon = { levels: { ...reference.levels }, current: [...reference.current], later: [...reference.later] };
    etat.computed.levels = { ...reference.levels };
    etat.computed.themes = calculerOuvertureLocale(brouillon.levels);
    try { localStorage.removeItem(cleBrouillon()); } catch {}
    majBarre();
    redessinerConstellations();
    if (competenceAffichee) rafraichirPanneau(competenceAffichee.code);
  });

  // Dernier filet : prévenir avant de quitter avec des modifications non enregistrées.
  window.addEventListener('beforeunload', (e) => {
    if (estModifie()) { e.preventDefault(); e.returnValue = ''; }
  });

  // ============================================================
  // LE CIEL — page d'arrivée
  // ============================================================
  const elCiel = document.getElementById('ciel');
  const elCielPiste = document.getElementById('ciel-piste');
  const elCielGuide = document.getElementById('ciel-guide');
  const elDetail = document.getElementById('detail');

  function situeesDe(dimension) {
    const codes = codesDeDimension(dimension);
    return { codes, situees: codes.filter((c) => (brouillon.levels[c] ?? 0) > 0).length };
  }

  // Largeur du fil décoratif, de part et d'autre de « Moi ».
  //
  // « Moi » est centré, donc chaque côté dispose de la même place ; mais à place égale
  // les deux voisines ne montrent PAS la même chose. Le bord droit de « Moi et les
  // autres » est clairsemé là où le bord gauche de « Moi et le monde » est dense : à
  // 295 px chacune, on lisait 3 thématiques à gauche contre 7 à droite, ce qui donnait
  // l'impression fausse d'un sphérier déséquilibré.
  //
  // Le fil ne portant aucun sens, sa largeur est le seul réglage libre. On la dépense
  // pour égaliser ce que révèle chaque amorce : 5 thématiques entières de chaque côté.
  // Mesuré sur le rendu — il faut 328 px de AUT et 292 px de MON pour en montrer cinq,
  // et chaque côté dispose de 388 px sur une piste de 1240. À refaire si la police de
  // la constellation ou les positions changent : ces largeurs en dépendent.
  // Fil décoratif entre deux blocs. Il ne dit rien de l'ouverture : la filiation reste
  // interne à chaque dimension. Il est là pour que le ciel se lise comme une carte
  // unique plutôt que comme trois pages côte à côte.
  //
  // `voisine` est la dimension située du côté extérieur du fil, c'est-à-dire celle dont
  // ce fil règle l'amorce.
  function filEntreBlocs(voisine) {
    const largeur = LARGEURS_FIL[voisine];
    return `<div class="ciel-lien" aria-hidden="true"${largeur ? ` style="--fil:${largeur}px"` : ''}>
      <svg viewBox="0 0 100 120" preserveAspectRatio="none">
        <path d="M0,60 C34,26 66,94 100,60"/>
      </svg>
    </div>`;
  }

  // Ordre VISUEL du ciel, délibérément distinct de l'ordre canonique du référentiel.
  //
  // « Moi » est le centre du modèle : les deux autres dimensions sont nommées par
  // rapport à lui. Une disposition radiale dit cette structure ; une disposition
  // linéaire suggérerait un ordre de lecture qui n'existe pas.
  //
  // Cet ordre ne vaut QUE pour le ciel. L'API, la vue d'ensemble, le parcours
  // « M'évaluer » et la navigation par dimension gardent l'ordre canonique
  // Moi · Moi et les autres · Moi et le monde, qui reste porté par
  // `etat.referentiel.dimensions` et n'est modifié nulle part.
  function dimensionsDuCiel() {
    // Sans ordre visuel configuré, le ciel suit l'ordre canonique.
    if (!ORDRE_CIEL) return etat.referentiel.dimensions.slice();
    const parId = new Map(etat.referentiel.dimensions.map((d) => [d.id, d]));
    // Une dimension qui ne serait pas dans l'ordre du ciel reste affichée, à la suite :
    // le ciel ne doit jamais escamoter une dimension que le référentiel déclare.
    return [
      ...ORDRE_CIEL.map((id) => parId.get(id)).filter(Boolean),
      ...etat.referentiel.dimensions.filter((d) => !ORDRE_CIEL.includes(d.id)),
    ];
  }

  function rendreCiel() {
    // Sur mobile le ciel n'est jamais affiché : trois constellations dessinées pour
    // rien coûteraient un temps de rendu sensible sur téléphone. Il sera dessiné si
    // l'écran s'élargit — voir l'écoute de `requeteMobile`.
    if (surMobile()) return;

    const ordreVisuel = dimensionsDuCiel();
    const blocs = ordreVisuel.map((d) => {
      const { codes, situees } = situeesDe(d);
      const teinte = TEINTES_HEX[d.id];
      const vierge = situees === 0;
      return `<section class="ciel-bloc" data-bloc="${echapper(d.id)}" style="--h:${teinte}">
        <div class="ciel-tete">
          <button type="button" class="ciel-nom" data-ouvrir="${echapper(d.id)}">
            <i></i>${echapper(d.name)}
          </button>
          <span class="ciel-compte">${vierge ? `${codes.length} compétences` : `${situees} / ${codes.length} évaluées`}</span>
          <button type="button" class="ciel-cta${vierge ? '' : ' discret'}" data-situer-ciel="${echapper(d.id)}">
            ${vierge ? 'Commencer par ici' : "Continuer à m'évaluer"}
          </button>
        </div>
        <div class="ciel-carte" data-ciel-carte="${echapper(d.id)}"></div>
      </section>`;
    });

    // Chaque fil est réglé par la dimension qu'il borde du côté extérieur : c'est
    // l'amorce de celle-là qu'il découvre ou qu'il masque.
    elCielPiste.innerHTML = blocs.reduce((html, bloc, i) => {
      if (i === 0) return bloc;
      const a = ordreVisuel[i - 1];
      const b = ordreVisuel[i];
      const exterieure = (a.id === CIEL_CENTRE) ? b.id : a.id;
      return html + filEntreBlocs(exterieure) + bloc;
    }, '');

    ordreVisuel.forEach((d) => {
      const carte = elCielPiste.querySelector(`[data-ciel-carte="${d.id}"]`);
      rendreConstellation(d.id, carte, { avecLegende: false });
      // Le bloc doit prendre la largeur de SA constellation. Un SVG en width:100% dans
      // un parent de largeur automatique est circulaire : on fixe donc la largeur du
      // conteneur d'après la géométrie calculée, pour que chaque dimension occupe son
      // emprise propre et garde ses libellés lisibles.
      const svg = carte.querySelector('svg');
      if (svg) {
        carte.style.width = svg.style.minWidth || `${Math.round(svg.viewBox.baseVal.width * ECHELLE_MINI)}px`;
        svg.style.minWidth = '';
      }
    });

    // Depuis le ciel, une thématique mène au détail de sa dimension plutôt que
    // d'ouvrir un panneau : on plonge, on ne consulte pas de biais.
    elCielPiste.querySelectorAll('.theme[data-theme]').forEach((g) => {
      const bloc = g.closest('[data-bloc]');
      const nouveau = g.cloneNode(true);
      g.replaceWith(nouveau);
      nouveau.addEventListener('click', () => ouvrirDetail(bloc.dataset.bloc, nouveau.dataset.theme));
    });
    elCielPiste.querySelectorAll('.etoile[data-competence]').forEach((g) => {
      const bloc = g.closest('[data-bloc]');
      const nouveau = g.cloneNode(true);
      g.replaceWith(nouveau);
      nouveau.addEventListener('click', (e) => {
        e.stopPropagation();
        ouvrirDetail(bloc.dataset.bloc);
        ouvrirCompetence(nouveau.dataset.competence, bloc.dataset.bloc);
      });
    });

    elCielPiste.querySelectorAll('[data-ouvrir]').forEach((btn) => {
      btn.addEventListener('click', () => ouvrirDetail(btn.dataset.ouvrir));
    });
    elCielPiste.querySelectorAll('[data-situer-ciel]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const d = etat.referentiel.dimensions.find((x) => x.id === btn.dataset.situerCiel);
        const codes = codesDeDimension(d);
        ouvrirMeSituer({
          codes, titre: d.name, teinte: TEINTES_HEX[d.id], depart: premiereNonSituee(codes),
        });
      });
    });

    const total = etat.referentiel.competencies.length;
    const situeesTotal = etat.referentiel.competencies.filter((c) => (brouillon.levels[c.id] ?? 0) > 0).length;
    elCielGuide.textContent = situeesTotal === 0
      ? 'Rien n’est encore allumé. Choisis une dimension et pose un premier repère : chaque étoile s’éclaire à mesure que tu t’évalues.'
      : `${situeesTotal} étoiles allumées sur ${total}. Touche une thématique pour entrer dedans.`;

    centrerCielSurMoi();
  }

  // Point d'ancrage horizontal d'un bloc dans la piste : le milieu de ses thématiques
  // RACINES, et non le milieu géométrique de sa boîte. Sur desktop les deux coïncident
  // presque. Sur mobile, où un bloc est plus large que la piste, c'est la différence
  // entre s'ouvrir sur les thématiques par lesquelles on peut commencer et s'ouvrir sur
  // une zone verrouillée. Même raisonnement que pour l'ouverture d'une constellation.
  function ancreHorizontale(bloc, idDimension) {
    const centreBoite = bloc.offsetLeft + bloc.offsetWidth / 2;
    const dimension = etat.referentiel.dimensions.find((d) => d.id === idDimension);
    const svg = bloc.querySelector('svg.constellation');
    if (!dimension || !svg) return centreBoite;

    const themes = etat.referentiel.themes.filter((t) => t.dimension === dimension.name);
    const racines = themes.filter((t) => !themes.some((o) => o.feeds.includes(t.id)));
    if (racines.length === 0) return centreBoite;

    const vb = svg.viewBox.baseVal;
    const rSvg = svg.getBoundingClientRect();
    if (rSvg.width === 0) return centreBoite;
    const echelle = rSvg.width / vb.width;
    const centre = racines.reduce((somme, t) => somme + t.x, 0) / racines.length;
    // Coordonnée dans le repère défilant de la piste, indépendante de l'offsetParent.
    return (rSvg.left - elCielPiste.getBoundingClientRect().left)
      + elCielPiste.scrollLeft + (centre - vb.x) * echelle;
  }

  // Le ciel s'ouvre centré sur « Moi », qui est le centre du modèle : les deux autres
  // dimensions sont nommées par rapport à lui. Le défilement part donc du milieu, avec
  // une amorce de chaque côté, et non d'un bord.
  function centrerCielSurMoi() {
    if (!CIEL_CENTRE) return;
    const bloc = elCielPiste.querySelector(`[data-bloc="${CIEL_CENTRE}"]`);
    if (!bloc) return;
    const x = ancreHorizontale(bloc, CIEL_CENTRE);
    elCielPiste.scrollLeft = Math.max(0, Math.min(x - elCielPiste.clientWidth / 2,
      elCielPiste.scrollWidth - elCielPiste.clientWidth));
  }


  // ============================================================
  // NAVIGATION ENTRE LES DEUX LIEUX
  // ============================================================
  // Le ciel est une vue DESKTOP, et seulement celle-là.
  //
  // Sur téléphone la piste fait moins de 400 px là où le seul bloc « Moi » en réclame
  // 464 pour garder ses libellés lisibles : aucune amorce latérale n'y tient, ni trois
  // ni deux, et la disposition radiale ne dit donc rien qu'on puisse voir. L'accueil
  // mobile est la navigation par dimension, accordéon entièrement replié : les trois
  // portes l'une sous l'autre, chacune avec son nom, son compte et son entrée.
  //
  // Les deux accueils restent la même VUE (`etat.vue === 'ciel'`) : c'est le lieu où
  // l'on revient, quel que soit l'écran qui le dessine.
  const requeteMobile = window.matchMedia('(max-width: 640px)');
  const surMobile = () => requeteMobile.matches;

  function allerAuCiel() {
    etat.vue = 'ciel';
    document.body.dataset.vue = 'ciel';

    if (surMobile()) {
      elCiel.hidden = true;
      elDetail.hidden = false;
      // Replier ce qui était ouvert : l'accueil, c'est le choix encore entier.
      if (etat.dimensionOuverte) basculerDimension(etat.dimensionOuverte);
      window.scrollTo({ top: 0, behavior: 'auto' });
      return;
    }

    elDetail.hidden = true;
    elCiel.hidden = false;
    requestAnimationFrame(centrerCielSurMoi);
  }

  // Passer d'un format à l'autre — rotation, fenêtre redimensionnée — doit redessiner
  // l'accueil dans sa forme, sans sortir le membre de là où il était.
  requeteMobile.addEventListener('change', () => {
    if (etat.vue !== 'ciel' || !etat.referentiel) return;
    if (!surMobile()) rendreCiel();
    allerAuCiel();
  });

  function ouvrirDetail(idDimension, idTheme = null) {
    etat.vue = 'detail';
    elCiel.hidden = true;
    elDetail.hidden = false;
    document.body.dataset.vue = 'detail';
    if (etat.dimensionOuverte !== idDimension) basculerDimension(idDimension);
    window.scrollTo({ top: 0, behavior: 'auto' });
    if (idTheme) {
      // Laisse la constellation se dessiner avant d'ouvrir le panneau de la thématique.
      requestAnimationFrame(() => ouvrirTheme(idTheme, idDimension));
    }
  }

  document.getElementById('detail-retour').addEventListener('click', allerAuCiel);

  // ============================================================
  // CHARGEMENT
  // ============================================================
  async function lireJson(url) {
    const reponse = await fetch(url);
    if (!reponse.ok) {
      const detail = await reponse.json().catch(() => ({}));
      throw new Error(detail.erreur || `Le serveur a répondu ${reponse.status}`);
    }
    return reponse.json();
  }

  async function demarrer() {
    if (!CLIENT_ID) {
      afficherMessage(
        'Lien invalide ou incomplet',
        "Ce lien ne permet pas de te reconnaître. Ouvre ton sphérier depuis ton espace pour retrouver ta progression.",
        'erreur'
      );
      document.body.dataset.lienValide = 'non';
      return;
    }
    document.body.dataset.lienValide = 'oui';

    try {
      // Les deux appels partent ensemble : le second réutilise le cache serveur du
      // référentiel, il ne paie donc pas une seconde lecture de Notion.
      const [referentiel, etatClient] = await Promise.all([
        lireJson('/api/referential'),
        lireJson(`/api/state?uuid=${encodeURIComponent(CLIENT_ID)}`),
      ]);

      etat.referentiel = referentiel;
      // AVANT tout rendu : teintes, difficultés, plafonds et ordre du ciel viennent du
      // serveur. Rien ne doit être dessiné tant que la page ignore de quel club il s'agit.
      appliquerConfigClub(referentiel);
      etat.computed = etatClient.computed;
      etat.snapshot = etatClient.snapshot;
      etat.notes = etatClient.notes || {};

      const sel = etatClient.snapshot?.blob?.selections ?? { current: [], later: [] };
      // Normalisation à la lecture : un snapshot écrit avant que l'exclusion mutuelle
      // n'existe peut contenir une compétence dans les deux listes. On l'affiche
      // proprement sans attendre le prochain enregistrement.
      const cur = [...new Set(sel.current || [])];
      reference = {
        levels: { ...etat.computed.levels },
        current: cur,
        later: [...new Set(sel.later || [])].filter((c) => !cur.includes(c)),
      };
      brouillon = { levels: { ...reference.levels }, current: [...reference.current], later: [...reference.later] };

      // Reprise d'un travail interrompu : page fermée, onglet perdu, réseau tombé.
      const repris = lireBrouillon();
      if (repris && repris.levels) {
        brouillon = {
          levels: { ...repris.levels },
          current: [...(repris.current || [])],
          later: [...(repris.later || [])],
        };
        if (estModifie()) {
          etat.computed.levels = { ...etat.computed.levels, ...brouillon.levels };
          etat.computed.themes = calculerOuvertureLocale(brouillon.levels);
          bandeau('Tes modifications ont été retrouvées.',
            "Elles n'avaient pas été enregistrées : elles t'attendaient sur cet appareil.", 'succes');
        } else {
          try { localStorage.removeItem(cleBrouillon()); } catch {}
        }
      }

      rendreDimensions();
      // Afficher AVANT de dessiner : getBBox() renvoie zéro dans un élément masqué, et
      // le cadrage se calculerait alors sur une boîte vide.
      masquerMessage();
      rendreCiel();
      majDernierPoint();
      majBarre();
      majBoutonMois();

      const ouvertes = Object.values(etat.computed.themes).filter((t) => t.status === 'open').length;
      // Formulation tournée vers ce qui est accessible : un ratio « 6 sur 40 » se lit
      // comme 34 portes fermées, alors que c'est une invitation.
      elHeaderEtatTexte.textContent = `${ouvertes} thématique${ouvertes > 1 ? 's' : ''} à explorer`;
      elHeaderEtat.hidden = false;

      document.body.dataset.pret = 'oui';
      document.body.dataset.snapshotCharge = etat.snapshot ? 'oui' : 'non';
    } catch (err) {
      afficherMessage(
        'Ton sphérier est momentanément indisponible',
        err.message,
        'erreur'
      );
      document.body.dataset.pret = 'erreur';
    }
  }

  demarrer();
</script>
